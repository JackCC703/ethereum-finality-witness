[package]
name = "finality-witness-bls-only"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
[workspace]
[dependencies]
finality-witness-core = { path = "../../core" }
serde_json = "1"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
[[bin]]
name = "finality-witness-guest-bls-only"
path = "../../guest/src/main.rs"
[patch.crates-io]
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", rev = "a3192e1bc58921d42d03d99957abf3be55f9d435" }
