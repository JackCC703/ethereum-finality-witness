[package]
name = "finality-witness-lez-actor-fast"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[workspace]
[lib]
name = "finality_witness_lez_actor"
path = "../lez-actor/src/lib.rs"
[[bin]]
name = "finality-witness-lez-actor-fast"
path = "../lez-actor/src/main.rs"
[[bin]]
name = "export-fast-sequence"
path = "../native/src/bin/export_sequence.rs"
[[bin]]
name = "measure-actor"
path = "src/measure.rs"
[[bin]]
name = "export-compact-sequence"
path = "src/export_compact.rs"
[dependencies]
finality-witness-core = { path = "../core", features = ["combined-pairing", "blst-backend", "compact-store"] }
serde_json = "1"
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "1806e873ea2ac0e1b608aa7cf2f9b6e1fb12db21" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
risc0-zkos-v1compat = "=2.2.2"
[target.'cfg(not(target_os = "zkvm"))'.dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["client"] }
risc0-binfmt = "=3.0.6"
[dev-dependencies]
borsh = "1"
[patch.crates-io]
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", rev = "a3192e1bc58921d42d03d99957abf3be55f9d435" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", rev = "c2b5d71c687cbccf9235069732c050486a01b1b2" }
blst = { git = "https://github.com/risc0/blst", rev = "7d1fc3e6d8cf0d52a291f52455233bf8d6432ed2" }
